name: 'CI/CD - Frontend (GHCR + Azure Container Apps)'

on:
  push:
    branches: ['develop', 'main']
  pull_request:
    branches: ['develop', 'main']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/tcc-2026-zello/zello-tcc-front
  AZURE_RESOURCE_GROUP: Zello
  AZURE_CONTAINER_APP_NAME: zello-front

jobs:
  # ---------------------------------------------------------
  # 1. TESTES UNITÁRIOS (VITEST) E VALIDAÇÃO DE BUILD
  # ---------------------------------------------------------
  test:
    name: Testes Unitários e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes unitários (Vitest)
        run: npm run test

      - name: Validar build de produção
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3001' }}

  # ---------------------------------------------------------
  # 2. BUILD E PUSH DA IMAGEM DOCKER (GITHUB CONTAINER REGISTRY)
  # ---------------------------------------------------------
  build-and-push:
    name: Build & Push (ghcr.io)
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (Automático via GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem para o GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_NOMINATIM_EMAIL=${{ secrets.VITE_NOMINATIM_EMAIL }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ---------------------------------------------------------
  # 3. DEPLOY NO AZURE CONTAINER APPS (GITHUB ACTIONS)
  # ---------------------------------------------------------
  deploy-aca:
    name: Deploy no Azure Container Apps
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar GHCR e Atualizar Container App (zello-front)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp registry set \
              --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --server ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password ${{ secrets.GITHUB_TOKEN }}

            az containerapp update \
              --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
