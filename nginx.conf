# Mantido por compatibilidade. A configuração em uso no contêiner é gerada a
# partir de nginx/default.conf.template (ver Dockerfile).
server {
    listen 80;
    server_name localhost;
    server_tokens off;

    location ~ /\. {
        return 404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
